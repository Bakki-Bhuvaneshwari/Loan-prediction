
<!DOCTYPE html>
<html>
<head>
    <title>Loan Prediction</title>
</head>

<body>

    <h2>Loan Prediction</h2>

    <form id="LoanApprovalForm">

        <input id="age" type="number" placeholder="Age" required><br><br>
        <input id="no_of_dependents" type="number" placeholder="Dependents" required><br><br>
        <input id="education" placeholder="Education" required><br><br>
        <input id="self_employed" placeholder="Self Employed" required><br><br>
        <input id="income_annum" type="number" placeholder="Annual Income" required><br><br>
        <input id="loan_amount" type="number" placeholder="Loan Amount" required><br><br>
        <input id="loan_term" type="number" placeholder="Loan Term" required><br><br>
        <input id="cibil_score" type="number" placeholder="CIBIL Score" required><br><br>
        <input id="residential_assets_value" type="number" placeholder="Residential Assets" required><br><br>
        <input id="commercial_assets_value" type="number" placeholder="Commercial Assets" required><br><br>
        <input id="luxury_assets_value" type="number" placeholder="Luxury Assets" required><br><br>
        <input id="bank_asset_value" type="number" placeholder="Bank Assets" required><br><br>
        <input id="employment_type" placeholder="Employment Type" required><br><br>
        <input id="years_employed" type="number" placeholder="Years Employed" required><br><br>
        <input id="loan_purpose" placeholder="Loan Purpose" required><br><br>
        <input id="property_area" placeholder="Property Area" required><br><br>
        <input id="credit_history_years" type="number" placeholder="Credit History Years" required><br><br>
        <input id="existing_loans" type="number" placeholder="Existing Loans" required><br><br>
        <input id="previous_defaults" type="number" placeholder="Previous Defaults" required><br><br>
        <input id="monthly_expenses" type="number" placeholder="Monthly Expenses" required><br><br>
        <input id="savings_balance" type="number" placeholder="Savings Balance" required><br><br>
        <input id="monthly_emi" type="number" placeholder="Monthly EMI" required><br><br>
        <input id="debt_to_income_ratio" type="number" step="any" placeholder="Debt to Income Ratio" required><br><br>
        <input id="interest_rate" type="number" step="any" placeholder="Interest Rate" required><br><br>

        <button type="submit">Predict</button>

    </form>

    <h2 id="result"></h2>

    <script>
    document.getElementById("LoanApprovalForm").addEventListener("submit", async function(event) {

        event.preventDefault();

        const fields = [
            "age", "no_of_dependents", "education", "self_employed",
            "income_annum", "loan_amount", "loan_term", "cibil_score",
            "residential_assets_value", "commercial_assets_value",
            "luxury_assets_value", "bank_asset_value", "employment_type",
            "years_employed", "loan_purpose", "property_area",
            "credit_history_years", "existing_loans", "previous_defaults",
            "monthly_expenses", "savings_balance", "monthly_emi",
            "debt_to_income_ratio", "interest_rate"
        ];

        const numericFields = [
            "age", "no_of_dependents", "income_annum", "loan_amount",
            "loan_term", "cibil_score", "residential_assets_value",
            "commercial_assets_value", "luxury_assets_value",
            "bank_asset_value", "years_employed", "credit_history_years",
            "existing_loans", "previous_defaults", "monthly_expenses",
            "savings_balance", "monthly_emi", "debt_to_income_ratio",
            "interest_rate"
        ];

        const data = {};

        fields.forEach(field => {
            const value = document.getElementById(field).value;
            data[field] = numericFields.includes(field) ? Number(value) : value;
        });

        const resultElement = document.getElementById("result");
        resultElement.innerText = "Predicting...";

        try {
            const response = await fetch("/predict", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify(data)
            });

            const resultData = await response.json();

            if (!response.ok) {
                resultElement.innerText =
                    "Prediction Error: " + (resultData.detail || "Unknown error");
                return;
            }

            resultElement.innerText =
                "Loan Status: " + resultData.loan_status;

        } catch (error) {
            resultElement.innerText = "Error: " + error.message;
        }
    });
    </script>

</body>
</html>
